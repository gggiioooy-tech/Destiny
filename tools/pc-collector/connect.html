<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>15월 PC 수집기</title><link rel="stylesheet" href="/connect.css"></head><body><main>
<header><span class="brand">❄ 15월</span><span id="activity" class="badge">연결 확인 중</span></header>
<section class="hero"><div class="mascot"><video id="mascot-video" autoplay muted loop playsinline preload="metadata" aria-label="키보드를 두드리는 캐릭터 애니메이션"><source src="https://i1.ruliweb.com/ori/23/03/01/1869c1266831f74ea.mp4?gif" type="video/mp4"></video><span id="mascot-fallback" hidden>❄</span><button id="motion-toggle" type="button" aria-label="애니메이션 일시정지">일시정지</button></div><div class="hero-copy"><p class="eyebrow">PC COLLECTOR</p><h1>기록은 내가 맡을게!</h1><p>전장과 전투 기록을 열어 주세요.<br>나머지는 차곡차곡 정리할게요.</p></div></section>
<section class="control"><div class="control-heading"><h2>게임 데이터 수집</h2><button id="capture-start" type="button">수집 시작 <span aria-hidden="true">→</span></button></div><p id="capture-info" role="status">수집 준비 중…</p><p id="sync-info" class="muted"></p></section>
<section class="records"><h2>수신 현황</h2><div class="metrics"><div><span>공격 기록</span><strong id="attack-count">0</strong></div><div><span>방어 기록</span><strong id="defense-count">0</strong></div><div><span>확인 대기</span><strong id="held-count">0</strong></div></div><p id="counts" class="sr-only"></p><p id="connection" role="status">사이트에서 ‘PC 수집기 연결’을 눌러 주세요.</p><p id="updated" class="muted"></p><p id="reason" class="notice"></p><ul id="groups"></ul></section>
<footer><p id="update-info">실행할 때 새 버전을 확인합니다.</p>이 창과 사이트를 열어 두세요.</footer>
</main><script src="/connect.js"></script></body></html>
